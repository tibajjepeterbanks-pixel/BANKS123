services:
  - type: web
    name: unipast-portal
    env: node
    region: oregon
    plan: free
    buildCommand: 'cd unipast-nextjs && npm ci && npx prisma generate && npm run build'
    startCommand: 'cd unipast-nextjs && npm start'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false





